bundle:
  name: databricks-daily-job

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the output table
    default: main
  schema:
    description: Unity Catalog schema for the output table
    default: daily_job

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-f2f718ce-e858.cloud.databricks.com
    variables:
      catalog: main
      schema: daily_job_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-f2f718ce-e858.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: daily_job