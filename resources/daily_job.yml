resources:
  jobs:
    daily_job:
      name: ${bundle.name}-${bundle.target}
      description: Daily infrastructure and pipeline health check
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}
      job_clusters:
        - job_cluster_key: daily_job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
            data_security_mode: USER_ISOLATION
      tasks:
        - task_key: write_daily_health_record
          job_cluster_key: daily_job_cluster
          spark_python_task:
            python_file: ../src/daily_job.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
      tags:
        managed_by: databricks-bundle
        workload: daily

variables:
  schedule_pause_status:
    description: Keep non-production schedules paused
    default: PAUSED

targets:
  prod:
    resources:
      jobs:
        daily_job:
          schedule:
            pause_status: UNPAUSED