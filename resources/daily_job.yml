resources:
  jobs:
    daily_job:
      name: ${bundle.name}-${bundle.target}
      description: Daily infrastructure and pipeline health check
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}
      tasks:
        - task_key: write_daily_health_record
          environment_key: serverless
          spark_python_task:
            python_file: ../src/daily_job.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
      tags:
        managed_by: databricks-bundle
        workload: daily

variables:
  schedule_pause_status:
    description: Keep non-production schedules paused
    default: PAUSED

targets:
  dev:
    resources:
      environments:
        serverless:
          spec:
            compute:
              kind: SERVERLESS
  prod:
    resources:
      environments:
        serverless:
          spec:
            compute:
              kind: SERVERLESS
      jobs:
        daily_job:
          schedule:
            pause_status: UNPAUSED